send:
  pending:
    # Supports <recipient>, <recipient_id>
    from: "<red>You already have a pending transfer to <aqua><recipient>!<red> Please wait for them to respond."
    # Supports <recipient>, <recipient_id>
    to: "<aqua><recipient><green> already has a pending pet transfer! Please wait for them to respond."
  target_pet: "<red>You must target a one of your pets to transfer!"
  no_recipient: "<red>Invalid recipient!"
  # Supports <owner>, <owner_id>, <pet>
  offer: |-
    <aqua><owner><green> would like to transfer <aqua>[<pet>]<green> to you!
    You have two minutes to <aqua>[<acceptpet>]<green> or <aqua>[<declinepet>]<green>.
  # Supports <recipient>, <recipient_id>, <pet>
  offered: "<green>Offered <aqua>[<pet>]<green> to <aqua><recipient><green>! They have two minutes to respond."
receive:
  no_pending: "<red>You don't have any pending pet transfers!"
  not_found:
    # Supports <recipient>, <recipient_id>
    sender: "<red>Unable to transfer pet! Please make sure you stay near it until the transfer completes."
    # Supports <owner>, <owner_id>
    recipient: "<red>Unable to locate pet!"
  accept:
    # Supports <recipient>, <recipient_id>, <pet>
    sender: "<green>Pet transferred!"
    # Supports <owner>, <owner_id>, <pet>
    recipient: "<green>Pet transferred!"
  decline:
    # Supports <recipient>, <recipient_id>
    sender: "<red>Pet transfer declined!"
    # Supports <owner>, <owner_id>, <ignore>
    recipient: |-
      <green>Declined pet transfer from <aqua><owner><green>!
      If they continue to send you unwanted pets, you can <aqua>[<ignore>]<green> them.
general:
    admin: "an administrator"
    unnamed_player: "someone (<uuid>)"
